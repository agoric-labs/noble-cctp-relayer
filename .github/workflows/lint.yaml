jobs:
  golangci:
    name: golangci-lint

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          check-latest: true
          go-version: "1.21"

      - name: Linting
        run: |
          make lint

      - name: Tests
        run: |
          go test ./...

name: Lint

on:
  push:
    branches:
      - main

permissions:
  contents: read
